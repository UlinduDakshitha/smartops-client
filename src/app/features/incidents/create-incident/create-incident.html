<div class="create-incident-page">

  <div class="page-header">
    <div>
      <h1>Create Incident</h1>
      <p>Report a new IT incident.</p>
    </div>
  </div>

  <div class="form-card">

    <form (ngSubmit)="onSubmit()">

      <div class="form-section">

        <h2>Incident Information</h2>

        <div class="form-grid">

          <div class="form-group full-width">
            <label for="title">Incident Title</label>

            <input
              id="title"
              name="title"
              type="text"
              placeholder="Enter incident title"
              [ngModel]="title()"
              (ngModelChange)="title.set($event)"
              required
            />
          </div>

          <div class="form-group">
            <label for="priority">Priority</label>

            <select
              id="priority"
              name="priority"
              [ngModel]="priority()"
              (ngModelChange)="priority.set($event)"
            >
              <option value="critical">Critical</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>

          <div class="form-group">
            <label for="category">Category</label>

            <select
              id="category"
              name="category"
              [ngModel]="category()"
              (ngModelChange)="category.set($event)"
            >
              <option value="infrastructure">Infrastructure</option>
              <option value="application">Application</option>
              <option value="network">Network</option>
              <option value="security">Security</option>
              <option value="database">Database</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label for="description">Description</label>

            <textarea
              id="description"
              name="description"
              rows="6"
              placeholder="Describe the incident..."
              [ngModel]="description()"
              (ngModelChange)="description.set($event)"
            ></textarea>
          </div>

        </div>

      </div>

      <div class="form-section">

        <h2>Assignment</h2>

        <div class="form-grid">

          <div class="form-group">
            <label for="team">Assign Team</label>

            <select
              id="team"
              name="team"
              [ngModel]="team()"
              (ngModelChange)="team.set($event)"
            >
              <option value="support">Support Team</option>
              <option value="devops">DevOps Team</option>
              <option value="security">Security Team</option>
            </select>
          </div>

          <div class="form-group">
            <label for="assignee">Assign To</label>

            <select
              id="assignee"
              name="assignee"
              [ngModel]="assignee()"
              (ngModelChange)="assignee.set($event)"
            >
              <option value="john">John Silva</option>
              <option value="sarah">Sarah Perera</option>
              <option value="michael">Michael Fernando</option>
            </select>
          </div>

        </div>

      </div>

      <div class="form-actions">

        <button
          type="button"
          class="cancel-button"
          (click)="cancel()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="submit-button"
        >
          Create Incident
        </button>

      </div>

    </form>

  </div>

</div>
